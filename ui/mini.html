<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Soundscape mini player</title>
    <link rel="stylesheet" href="style.css" />
    <script src="mini.js" defer></script>
  </head>
  <body class="mini">
    <main>
      <div class="mini-cover" id="cover"><img id="art" alt="" hidden /></div>
      <div class="mini-info">
        <strong id="title">Nothing playing</strong>
        <span id="artist" class="muted"></span>
        <div class="mini-seek">
          <span id="time" class="muted">0:00</span>
          <input type="range" id="seek" min="0" max="1" step="0.1" value="0" aria-label="Seek" disabled />
          <span id="length" class="muted">0:00</span>
        </div>
        <div class="mini-controls">
          <button type="button" class="secondary mini-mode" data-action="shuffle" id="shuffle" aria-label="Shuffle" aria-pressed="false" hidden>
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h3.5c2 0 3.2 1 4.3 2.7l2.4 4.6c1.1 1.7 2.3 2.7 4.3 2.7H20" /><path d="M3 17h3.5c1.3 0 2.3-.4 3.1-1.2M13.4 8.2c.8-.8 1.8-1.2 3.1-1.2H20" /><path d="M17.5 4.5 20 7l-2.5 2.5M17.5 14.5 20 17l-2.5 2.5" /></svg>
          </button>
          <button type="button" class="secondary" data-action="previous" aria-label="Previous">⏮</button>
          <button type="button" class="secondary" data-action="toggle" id="toggle" aria-label="Play or pause">⏯</button>
          <button type="button" class="secondary" data-action="next" aria-label="Next">⏭</button>
          <button type="button" class="secondary mini-mode" data-action="repeat" id="repeat" aria-label="Repeat" aria-pressed="false" hidden>
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11V9.5A2.5 2.5 0 0 1 6.5 7H19M16.5 4.5 19 7l-2.5 2.5" /><path d="M20 13v1.5a2.5 2.5 0 0 1-2.5 2.5H5M7.5 19.5 5 17l2.5-2.5" /><path id="repeat-one" d="M11.3 10.8 12.5 10v4" stroke-width="1.6" visibility="hidden" /></svg>
          </button>
          <button type="button" class="secondary" data-action="love" id="love" aria-label="Love this song">♡</button>
        </div>
        <small id="next" class="muted" hidden></small>
        <small id="message" class="error" hidden></small>
      </div>
    </main>
  </body>
</html>
