[package]
name = "soundscape-core"
version = "0.10.6"
edition = "2021"
publish = false

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
url = "2"
gethostname = "1"
zbus = "5"
gstreamer = "0.25"
ksni = "0.3"
png = "0.18"
futures-util = "0.3"
