[package]
name = "soundscape-desktop"
version = "0.9.16"
description = "Desktop app for Soundscape, the self-hosted music tracker"
edition = "2021"
license = "AGPL-3.0-or-later"
rust-version = "1.85"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-opener = "2.7.3"
tauri-plugin-notification = "2.8.1"
tauri-plugin-single-instance = "2.5.5"
tokio = { version = "1.54.1", features = ["time", "sync"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
url = "2.5.8"
gethostname = "1.1.0"
zbus = "5.19.0"
webkit2gtk = { version = "2.0.2", features = ["v2_40"] }
javascriptcore-rs = "1.1.2"
gstreamer = "0.21.3"

[profile.release]
lto = true
codegen-units = 1
strip = true
