name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, lint, tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v5
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake m4 gperf python3 pkg-config dbus \
            libdbus-1-dev libfreetype6-dev libfontconfig-dev libharfbuzz-dev liblzma-dev libudev-dev libunwind-dev \
            libgl-dev libegl1-mesa-dev libgles2-mesa-dev libwayland-dev libxkbcommon-dev libx11-dev libx11-xcb-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libgstreamer-plugins-bad1.0-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked --release -- -D warnings
      - run: dbus-run-session -- cargo test --workspace --locked --release
      - run: cargo build --release --locked

  metadata:
    name: Desktop file and store listing
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y appstream desktop-file-utils
      - run: desktop-file-validate flatpak/io.github.novakr12.SoundscapeDesktop.desktop
      - run: appstreamcli validate --no-net --explain flatpak/io.github.novakr12.SoundscapeDesktop.metainfo.xml

  flatpak:
    name: Flatpak
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: >-
        --privileged
        -v /usr/local/lib/android:/unused/android
        -v /usr/share/dotnet:/unused/dotnet
        -v /opt/hostedtoolcache:/unused/toolcache
        -v /usr/local/share/boost:/unused/boost
        -v /usr/local/.ghcup:/unused/ghcup
    steps:
      - name: Free disk space
        run: |
          df -h /
          rm -rf /unused/android/* /unused/dotnet/* /unused/toolcache/* /unused/boost/* /unused/ghcup/*
          df -h /
      - uses: actions/checkout@v5
      - name: Move the preinstalled runtimes where Flatpak can update them
        run: |
          cp -a /var/lib/flatpak /var/lib/flatpak-copy
          rm -rf /var/lib/flatpak
          mv /var/lib/flatpak-copy /var/lib/flatpak
      - name: List the Rust crates for the offline build
        run: python3 flatpak/cargo-sources.py
      - uses: flathub-infra/flatpak-github-actions/flatpak-builder@933e9e8ca36e85046ebca8e211f0785c6becac40
        with:
          bundle: soundscape-desktop.flatpak
          manifest-path: flatpak/io.github.novakr12.SoundscapeDesktop.yml
          cache-key: flatpak-builder-${{ github.sha }}
