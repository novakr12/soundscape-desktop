id: io.github.novakr12.SoundscapeQtPreview
runtime: org.kde.Platform
runtime-version: '6.10'
sdk: org.kde.Sdk
base: io.qt.qtwebengine.BaseApp
base-version: '6.10'
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: soundscape-qt
finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --socket=pulseaudio
cleanup-commands:
  - /app/cleanup-BaseApp.sh
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
modules:
  - name: soundscape-qt
    buildsystem: simple
    build-options:
      build-args:
        - --share=network
      env:
        CARGO_HOME: /run/build/soundscape-qt/cargo
    build-commands:
      - QMAKE="$(command -v qmake6 || command -v qmake)" cargo build --release
      - install -Dm755 target/release/soundscape-qt /app/bin/soundscape-qt
    sources:
      - type: dir
        path: ..
        skip:
          - target
          - flatpak
