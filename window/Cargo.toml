[package]
name = "soundscape-window"
version = "0.13.0"
edition = "2024"
publish = false

[dependencies]
servo = { version = "=0.8.0", default-features = false, features = ["bundled", "clipboard", "js_jit", "media-gstreamer"] }
servo-base = "=0.8.0"
servo-allocator = { version = "=0.8.0", features = ["use-jemalloc"] }
wayland-client = { version = "0.31", features = ["system"] }
winit = "0.30.13"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12", "logging"] }
url = "2"
euclid = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.4"
libc = "0.2"
png = "0.18"
soundscape-protocol = { path = "../protocol" }
