[package]
name = "soundscape-desktop"
version = "0.11.4"
edition = "2024"
publish = false

[dependencies]
winit = "0.30.13"
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.4"
libc = "0.2"
memmap2 = "0.9"
softbuffer = { version = "0.4", default-features = false, features = ["x11", "wayland"] }
resvg = { version = "0.48", default-features = false }
ab_glyph = "0.2"
fontdb = "0.24"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
soundscape-core = { path = "core" }
soundscape-protocol = { path = "protocol" }

[workspace]
members = ["core", "protocol", "window"]

[profile.release]
debug = false
lto = "thin"
strip = "symbols"
