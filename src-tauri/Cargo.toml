[package]
name = "soundscape-desktop"
version = "0.1.0"
description = "Desktop app for Soundscape, the self-hosted music tracker"
edition = "2021"
license = "AGPL-3.0-or-later"
rust-version = "1.85"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
tauri-plugin-opener = "2.7.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
url = "2.5.8"
gethostname = "1.1.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
