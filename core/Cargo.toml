[package]
name = "soundscape-core"
version = "0.15.3"
edition = "2021"
publish = false

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros", "net", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
url = "2"
gethostname = "1"
zbus = { version = "5", default-features = false, features = ["tokio"] }
gstreamer = "0.25"
ksni = { version = "0.3", default-features = false, features = ["tokio"] }
png = "0.18"
futures-util = "0.3"
oo7 = { version = "0.7", default-features = false, features = ["tokio", "native_crypto"] }
libc = "0.2"
soundscape-protocol = { path = "../protocol" }
