<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Connect to Soundscape</title>
    <link rel="stylesheet" href="style.css" />
    <script src="setup.js" defer></script>
  </head>
  <body>
    <main>
      <img src="logo.svg" alt="" width="64" height="64" />
      <h1>Connect to Soundscape</h1>
      <p class="muted">Enter the address you open Soundscape at in your browser.</p>
      <form id="connect">
        <label for="address">Server address</label>
        <input
          id="address"
          name="address"
          type="text"
          inputmode="url"
          autocomplete="url"
          spellcheck="false"
          placeholder="https://music.example.com"
          required
        />
        <button type="submit">Connect</button>
        <p id="message" class="error" role="alert" hidden></p>
      </form>
      <p class="muted small">
        You'll log in on the next page. The app gets its own token, which you can revoke on Soundscape's Connect page.
      </p>
    </main>
  </body>
</html>
