id: io.github.novakr12.SoundscapeDesktop
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: soundscape-desktop
finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --socket=pulseaudio
  - --talk-name=org.mpris.MediaPlayer2.*
  - --own-name=org.mpris.MediaPlayer2.SoundscapeDesktop
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.freedesktop.Notifications
  - --filesystem=xdg-run/discord-ipc-0
  - --filesystem=xdg-run/app/com.discordapp.Discord:create

modules:
  - name: soundscape-desktop
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/soundscape-desktop/cargo
        CARGO_NET_OFFLINE: 'true'
        MOZJS_ARCHIVE: /run/build/soundscape-desktop/libmozjs-x86_64-unknown-linux-gnu.tar.gz
    build-commands:
      - cargo build --release --locked --offline
      - install -Dm755 target/release/soundscape-desktop /app/bin/soundscape-desktop
      - install -Dm644 flatpak/io.github.novakr12.SoundscapeDesktop.desktop /app/share/applications/io.github.novakr12.SoundscapeDesktop.desktop
      - install -Dm644 flatpak/io.github.novakr12.SoundscapeDesktop.metainfo.xml /app/share/metainfo/io.github.novakr12.SoundscapeDesktop.metainfo.xml
      - install -Dm644 flatpak/io.github.novakr12.SoundscapeDesktop.search-provider.ini /app/share/gnome-shell/search-providers/io.github.novakr12.SoundscapeDesktop.search-provider.ini
      - install -Dm644 flatpak/io.github.novakr12.SoundscapeDesktop.krunner.desktop /app/share/krunner/dbusplugins/io.github.novakr12.SoundscapeDesktop.desktop
      - install -Dm644 icons/icon.svg /app/share/icons/hicolor/scalable/apps/io.github.novakr12.SoundscapeDesktop.svg
      - install -Dm644 icons/128x128.png /app/share/icons/hicolor/128x128/apps/io.github.novakr12.SoundscapeDesktop.png
      - install -Dm644 icons/128x128@2x.png /app/share/icons/hicolor/256x256/apps/io.github.novakr12.SoundscapeDesktop.png
      - install -Dm644 icons/icon.png /app/share/icons/hicolor/512x512/apps/io.github.novakr12.SoundscapeDesktop.png
    sources:
      - type: dir
        path: ..
        skip:
          - target
          - flatpak/.flatpak-builder
          - flatpak/build-dir
          - flatpak/repo
      - type: file
        url: https://github.com/servo/mozjs/releases/download/mozjs-sys-v153.6.0-1/libmozjs-x86_64-unknown-linux-gnu.tar.gz
        sha256: 4b08d48e98839e058c6523ed103f7874874acfa57a1d54ef93cadc21e7168f37
      - cargo-sources.json
