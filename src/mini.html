<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Soundscape mini player</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #111111;
        --muted: #666666;
        --accent: #18a34a;
        --error: #c62828;
        --field: #f4f4f2;
        --border: #d6d5ce;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0a0e14;
          --fg: #eeeeee;
          --muted: #9aa3ae;
          --accent: #1db151;
          --error: #ff8a80;
          --field: #151b23;
          --border: #2c333d;
        }
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        overflow: hidden;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
        user-select: none;
      }

      main {
        display: flex;
        align-items: center;
        gap: 14px;
        height: 100%;
        padding: 14px;
      }

      .cover {
        flex: none;
        width: 96px;
        height: 96px;
        border-radius: 8px;
        background: var(--field);
        overflow: hidden;
      }

      .cover img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .info {
        display: flex;
        flex: 1;
        flex-direction: column;
        gap: 4px;
        min-width: 0;
      }

      .line {
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }

      .muted {
        color: var(--muted);
      }

      .seek {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        font-variant-numeric: tabular-nums;
      }

      .track {
        position: relative;
        flex: 1;
        height: 14px;
        cursor: pointer;
      }

      .track::before,
      .fill {
        position: absolute;
        top: 5px;
        left: 0;
        height: 4px;
        border-radius: 2px;
        content: "";
      }

      .track::before {
        right: 0;
        background: var(--border);
      }

      .fill {
        width: 0;
        background: var(--accent);
      }

      .track.off {
        cursor: default;
        opacity: 0.6;
      }

      .controls {
        display: flex;
        gap: 6px;
      }

      button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 38px;
        height: 30px;
        padding: 0 8px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--field);
        color: var(--fg);
        font: inherit;
        cursor: pointer;
      }

      button:disabled {
        opacity: 0.45;
        cursor: default;
      }

      button[hidden] {
        display: none;
      }

      button.mode {
        min-width: 32px;
        color: var(--muted);
      }

      button[aria-pressed="true"] {
        border-color: var(--accent);
        color: var(--accent);
      }

      svg {
        width: 16px;
        height: 16px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      svg.solid {
        fill: currentColor;
        stroke: none;
      }

      small {
        font-size: 12px;
      }

      .error {
        color: var(--error);
      }
    </style>
  </head>
  <body>
    <main>
      <div class="cover"><img id="art" alt="" hidden /></div>
      <div class="info">
        <strong id="title" class="line">Nothing playing</strong>
        <span id="artist" class="line muted">Start a song in any player.</span>
        <div class="seek">
          <span id="time" class="muted">0:00</span>
          <div id="track" class="track off" role="slider" aria-label="Seek" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0">
            <div id="fill" class="fill"></div>
          </div>
          <span id="length" class="muted">0:00</span>
        </div>
        <div class="controls">
          <button type="button" class="mode" data-action="shuffle" id="shuffle" aria-label="Shuffle" aria-pressed="false" hidden>
            <svg viewBox="0 0 24 24"><path d="M3 7h3.5c2 0 3.2 1 4.3 2.7l2.4 4.6c1.1 1.7 2.3 2.7 4.3 2.7H20" /><path d="M3 17h3.5c1.3 0 2.3-.4 3.1-1.2M13.4 8.2c.8-.8 1.8-1.2 3.1-1.2H20" /><path d="M17.5 4.5 20 7l-2.5 2.5M17.5 14.5 20 17l-2.5 2.5" /></svg>
          </button>
          <button type="button" data-action="previous" id="previous" aria-label="Previous">
            <svg class="solid" viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z" /></svg>
          </button>
          <button type="button" data-action="toggle" id="toggle" aria-label="Play or pause">
            <svg class="solid" viewBox="0 0 24 24" id="play-icon"><path d="M7 4v16l13-8z" /></svg>
            <svg class="solid" viewBox="0 0 24 24" id="pause-icon" style="display: none"><path d="M6 4h4v16H6zM14 4h4v16h-4z" /></svg>
          </button>
          <button type="button" data-action="next" id="next-button" aria-label="Next">
            <svg class="solid" viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l11-7z" /></svg>
          </button>
          <button type="button" class="mode" data-action="repeat" id="repeat" aria-label="Repeat" aria-pressed="false" hidden>
            <svg viewBox="0 0 24 24"><path d="M4 11V9.5A2.5 2.5 0 0 1 6.5 7H19M16.5 4.5 19 7l-2.5 2.5" /><path d="M20 13v1.5a2.5 2.5 0 0 1-2.5 2.5H5M7.5 19.5 5 17l2.5-2.5" /><path id="repeat-one" d="M11.3 10.8 12.5 10v4" stroke-width="1.6" visibility="hidden" /></svg>
          </button>
          <button type="button" data-action="love" id="love" aria-label="Love this song" aria-pressed="false" disabled>
            <svg viewBox="0 0 24 24" id="heart"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z" /></svg>
          </button>
        </div>
        <small id="up-next" class="line muted" hidden></small>
        <small id="message" class="line error" hidden></small>
      </div>
    </main>
    <script>
      (() => {
        const REPEAT_LABELS = { off: "Repeat is off", all: "Repeating the queue", one: "Repeating this song" };
        const element = (id) => document.getElementById(id);
        const track = element("track");
        const message = element("message");
        let length = 0;
        let seekable = false;
        let dragging = false;

        function ask(action, seconds) {
          message.hidden = true;
          console.log("soundscape-mini " + JSON.stringify(seconds == null ? { action } : { action, seconds }));
        }

        function clock(ms) {
          if (ms == null || !Number.isFinite(ms) || ms < 0) return "0:00";
          const seconds = Math.floor(ms / 1000);
          return `${Math.floor(seconds / 60)}:${String(seconds % 60).padStart(2, "0")}`;
        }

        function place(ms) {
          const share = length > 0 ? Math.min(Math.max(ms / length, 0), 1) : 0;
          element("fill").style.width = `${share * 100}%`;
          element("time").textContent = clock(ms);
          track.setAttribute("aria-valuenow", String(Math.round(ms / 1000)));
        }

        function pointed(event) {
          const box = track.getBoundingClientRect();
          return Math.min(Math.max((event.clientX - box.left) / box.width, 0), 1) * length;
        }

        function showMode(button, on, label, shown) {
          button.hidden = !shown;
          button.setAttribute("aria-pressed", String(on));
          button.title = label;
        }

        function render(view) {
          if (!view) return;
          const playing = view.kind !== "none" && view.kind !== "";
          element("title").textContent = playing ? view.title : "Nothing playing";
          element("artist").textContent = playing ? `${view.artist} · ${view.source}` : "Start a song in any player.";
          const art = element("art");
          if (view.art) {
            if (art.getAttribute("src") !== view.art) art.src = view.art;
            art.hidden = false;
          } else {
            art.hidden = true;
            art.removeAttribute("src");
          }
          length = view.length_ms ?? 0;
          seekable = Boolean(view.can_seek) && length > 0;
          track.classList.toggle("off", !seekable);
          track.setAttribute("aria-valuemax", String(Math.round(length / 1000)));
          element("length").textContent = clock(length);
          if (!dragging) place(Math.min(view.position_ms ?? 0, length || Number.MAX_SAFE_INTEGER));
          element("play-icon").style.display = view.playing ? "none" : "";
          element("pause-icon").style.display = view.playing ? "" : "none";
          element("toggle").disabled = !playing;
          element("previous").disabled = !view.can_skip;
          element("next-button").disabled = !view.can_next;
          showMode(element("shuffle"), view.shuffle === true, view.shuffle ? "Shuffle is on" : "Shuffle is off", view.shuffle != null);
          const repeat = view.repeat ?? "off";
          showMode(element("repeat"), repeat !== "off", REPEAT_LABELS[repeat] ?? REPEAT_LABELS.off, view.repeat != null);
          element("repeat-one").setAttribute("visibility", repeat === "one" ? "visible" : "hidden");
          const next = element("up-next");
          next.textContent = view.up_next ? `Up next: ${view.up_next}` : "";
          next.hidden = !view.up_next;
          const love = element("love");
          love.disabled = !view.can_love;
          love.setAttribute("aria-pressed", String(Boolean(view.loved)));
          element("heart").classList.toggle("solid", Boolean(view.loved));
        }

        function failed(problem) {
          message.textContent = String(problem);
          message.hidden = false;
        }

        for (const button of document.querySelectorAll("[data-action]")) {
          button.addEventListener("click", () => ask(button.dataset.action));
        }

        track.addEventListener("mousedown", (event) => {
          if (!seekable) return;
          dragging = true;
          place(pointed(event));
        });

        window.addEventListener("mousemove", (event) => {
          if (dragging) place(pointed(event));
        });

        window.addEventListener("mouseup", (event) => {
          if (!dragging) return;
          const at = pointed(event);
          place(at);
          dragging = false;
          ask("seek", at / 1000);
        });

        window.soundscapeMini = { render, failed };
      })();
    </script>
  </body>
</html>
